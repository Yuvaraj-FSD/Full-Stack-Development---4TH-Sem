<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ JS Control Panel | Premium Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #00ffcc;
      --secondary: #7000ff;
      --bg: #0a0a0c;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(112, 0, 255, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(0, 255, 204, 0.1) 0px, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 40px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      width: 100%;
      max-width: 1200px;
    }

    .box {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 30px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .box:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
      box-shadow: 0 15px 40px rgba(0, 255, 204, 0.15);
    }

    h3 {
      font-weight: 600;
      font-size: 1.4rem;
      color: var(--text);
    }

    button {
      background: linear-gradient(135deg, var(--primary), #00ccaa);
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
    }

    button:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #00ffcc, #ffffff);
    }

    input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 12px 20px;
      border-radius: 12px;
      color: #fff;
      width: 100%;
      outline: none;
      font-family: inherit;
      text-align: center;
    }

    input:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.1);
    }

    #output {
      min-height: 40px;
      font-weight: 300;
      font-style: italic;
      color: var(--text-dim);
    }

    .slider-container {
      width: 200px;
      height: 200px;
      border-radius: 18px;
      overflow: hidden;
      margin: 10px 0;
      border: 2px solid var(--card-border);
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #count {
      font-size: 4rem;
      font-weight: 800;
      color: var(--primary);
      text-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
      margin: 10px 0;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .box {
      animation: fadeIn 0.6s ease backwards;
    }

    .box:nth-child(1) { animation-delay: 0.1s; }
    .box:nth-child(2) { animation-delay: 0.2s; }
    .box:nth-child(3) { animation-delay: 0.3s; }
    .box:nth-child(4) { animation-delay: 0.4s; }
    .box:nth-child(5) { animation-delay: 0.5s; }
  </style>
</head>

<body>

  <h1>⚡ JS Control Panel</h1>

  <div class="container">

    <!-- Color -->
    <div class="box">
      <h3>Background Logic</h3>
      <p style="color: var(--text-dim); font-size: 0.9rem;">Toggle between dynamic gradients</p>
      <button onclick="changeColor()">Cycle Themes</button>
    </div>

    <!-- Live Text -->
    <div class="box">
      <h3>Live Text Engine</h3>
      <input type="text" id="inputBox" onkeyup="showText()" placeholder="Type something magic...">
      <p id="output">Your text will appear here...</p>
    </div>

    <!-- Password -->
    <div class="box">
      <h3>Vault Access</h3>
      <input type="password" id="password" placeholder="Enter secret password">
      <button onclick="togglePassword()" class="btn-secondary">Show / Hide</button>
    </div>

    <!-- Slider -->
    <div class="box">
      <h3>Visual Explorer</h3>
      <div class="slider-container">
        <img id="slider" src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&q=80&w=400" alt="Tech Visual">
      </div>
      <button onclick="nextImage()">Next Vision</button>
    </div>

    <!-- Counter -->
    <div class="box">
      <h3>Performance Meter</h3>
      <div id="count">0</div>
      <div class="btn-group">
        <button onclick="decrease()" class="btn-secondary">—</button>
        <button onclick="increase()">+</button>
        <button onclick="reset()" class="btn-secondary">Reset</button>
      </div>
    </div>

  </div>

  <script>
    // Color Logic with Array of Gradients
    const themes = [
      { bg: "#0a0a0c", primary: "#00ffcc", secondary: "#7000ff" },
      { bg: "#0f172a", primary: "#38bdf8", secondary: "#818cf8" },
      { bg: "#180828", primary: "#f472b6", secondary: "#fb7185" },
      { bg: "#061618", primary: "#fbbf24", secondary: "#f59e0b" }
    ];
    let themeIndex = 0;

    function changeColor() {
      themeIndex = (themeIndex + 1) % themes.length;
      const theme = themes[themeIndex];
      document.documentElement.style.setProperty('--bg', theme.bg);
      document.documentElement.style.setProperty('--primary', theme.primary);
      document.documentElement.style.setProperty('--secondary', theme.secondary);
      
      document.body.style.backgroundImage = `
        radial-gradient(at 0% 0%, ${theme.secondary}26 0px, transparent 50%),
        radial-gradient(at 100% 100%, ${theme.primary}1a 0px, transparent 50%)
      `;
    }

    // Live Text logic
    function showText() {
      let text = document.getElementById("inputBox").value;
      document.getElementById("output").textContent = text || "Your text will appear here...";
    }

    // Password Toggle logic
    function togglePassword() {
      let pass = document.getElementById("password");
      pass.type = pass.type === "password" ? "text" : "password";
    }

    // Image Slider logic (Unsplash images for reliability)
    const visions = [
      "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&q=80&w=400",
      "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&q=80&w=400",
      "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&q=80&w=400",
      "https://images.unsplash.com/photo-1531297484001-80022131f5a1?auto=format&fit=crop&q=80&w=400"
    ];
    let visionIndex = 0;

    function nextImage() {
      visionIndex = (visionIndex + 1) % visions.length;
      const slider = document.getElementById("slider");
      slider.style.opacity = 0;
      setTimeout(() => {
        slider.src = visions[visionIndex];
        slider.style.opacity = 1;
      }, 200);
    }

    // Counter logic
    let count = 0;
    const countEl = document.getElementById("count");

    function updateCounter() {
      countEl.textContent = count;
      // Add a little pop effect
      countEl.style.transform = "scale(1.2)";
      setTimeout(() => countEl.style.transform = "scale(1)", 100);
    }

    function increase() {
      count++;
      updateCounter();
    }

    function decrease() {
      if (count > 0) count--;
      updateCounter();
    }

    function reset() {
      count = 0;
      updateCounter();
    }
  </script>

</body>
</html>
